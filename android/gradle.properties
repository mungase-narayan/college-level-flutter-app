# The Flutter template ships -Xmx8G/-XX:MaxMetaspaceSize=4G, which assumes a
# machine with far more RAM than this one has in total. A release build has to
# run Gradle *and* the Dart AOT snapshot generator, and gen_snapshot is the
# hungrier of the two — leaving the template values in place gets it SIGKILLed
# by the OOM killer partway through `assembleRelease`.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
